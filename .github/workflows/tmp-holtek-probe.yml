name: Temporary Holtek Probe

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Holtek page content API
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.holtek.com.cn/page/contentDetail?cCode=c060063&cMonth=0&cYear=2026'
          api='https://www.holtek.com.cn/webapi/api/Page/GetPageHtml'
          for lang in 0 1 2 3; do
            echo "===== language $lang ====="
            curl -fL --max-time 30 --retry 1 -A 'Mozilla/5.0' \
              -G "$api" \
              --data-urlencode "CLanguageType=$lang" \
              --data-urlencode "CUrl=$page" \
              -o "page-$lang.json" || continue
            python3 - "$lang" <<'PY'
          import json,re,sys
          lang=sys.argv[1]
          path=f'page-{lang}.json'
          raw=open(path,'r',encoding='utf-8',errors='ignore').read()
          print('bytes=',len(raw))
          try:
              obj=json.loads(raw)
              print('StatusCode=',obj.get('StatusCode'))
              entries=obj.get('Entries') or {}
              print('keys=',sorted(entries.keys()) if isinstance(entries,dict) else type(entries).__name__)
              text=json.dumps(entries,ensure_ascii=False)
          except Exception as e:
              print('json error=',repr(e))
              text=raw
          for pat in [r'HT-IDE',r'8\.3\.3',r'833',r'\.zip',r'\.exe',r'documents/',r'webapi/',r'https?://']:
              print('\n--',pat,'--')
              for m in list(re.finditer(pat,text,re.I))[:20]:
                  s=max(0,m.start()-220); e=min(len(text),m.end()+500)
                  print(text[s:e].replace('\\n',' ').replace('\\r',' '))
          PY
          done
