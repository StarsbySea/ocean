name: Temporary Holtek Probe

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect HT-IDE3000 8.3.4 page and download handlers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, re, urllib.parse, html

          base='https://www.holtek.com.cn'
          pageapi=base+'/webapi/api/Page/GetPageHtml'
          page=base+'/page/contentDetail?cCode=c060148'
          q=urllib.parse.urlencode({'CLanguageType':3,'CUrl':page})
          p=subprocess.run(['curl','-fsSL','--max-time','30','-A','Mozilla/5.0',pageapi+'?'+q],capture_output=True,text=True,check=True)
          obj=json.loads(p.stdout)
          entries=obj.get('Entries') or {}
          content=html.unescape(entries.get('HtmlContent') or '')
          print('=== PAGE KEYS ===')
          print(json.dumps({k:v for k,v in entries.items() if k!='HtmlContent'},ensure_ascii=False,indent=2))
          print('=== HTML CONTENT ===')
          print(content[:30000])
          print('=== ATTRIBUTES / LINKS ===')
          pats=[
            r'href\s*=\s*["\']([^"\']+)',
            r'src\s*=\s*["\']([^"\']+)',
            r'onclick\s*=\s*["\']([^"\']+)',
            r'data-[\w-]+\s*=\s*["\']([^"\']+)',
            r'[^\s"\'<>]+\.(?:zip|exe|msi)(?:\?[^\s"\'<>]*)?',
            r'/webapi/[^\s"\'<>]+'
          ]
          for pat in pats:
            vals=[]
            for m in re.finditer(pat,content,re.I):
              v=m.group(1) if m.lastindex else m.group(0)
              if v not in vals: vals.append(v)
            print('\nPATTERN',pat)
            for v in vals[:100]: print(v)

          scripts=[]
          for path in entries.get('JsPath') or []:
            if isinstance(path,str): scripts.append(path)
          if isinstance(entries.get('JsPath'),str): scripts.append(entries['JsPath'])
          scripts += ['/webapi/fl26790796/news.js']
          seen=set()
          for s in scripts:
            if not s or s in seen: continue
            seen.add(s)
            u=s if s.startswith('http') else base+s
            print('\n=== SCRIPT',u,'===')
            r=subprocess.run(['curl','-fsSL','--max-time','30','-A','Mozilla/5.0',u],capture_output=True,text=True)
            if r.returncode:
              print('curl failed',r.stderr.strip()); continue
            text=r.stdout
            print(text[:30000])
            print('--- API / download candidates ---')
            vals=[]
            for pat in [r'/webapi/api/[A-Za-z0-9_/?=&.-]+',r'/webapi/[A-Za-z0-9_/?=&().%+-]+',r'https?://[^"\'\s<>]+',r'[A-Za-z0-9_.+-]+\.(?:zip|exe|msi)']:
              for m in re.finditer(pat,text,re.I):
                v=m.group(0)
                if v not in vals: vals.append(v)
            for v in vals[:150]: print(v)
          PY
