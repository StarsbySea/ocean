name: Temporary Holtek Probe

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Locate HT-IDE3000 8.3.3 release asset
        shell: bash
        run: |
          set -euo pipefail
          search='https://www.holtek.com.cn/webapi/api/Page/GetSearchResult'
          pageapi='https://www.holtek.com.cn/webapi/api/Page/GetPageHtml'
          python3 - <<'PY'
          import json,subprocess,re,urllib.parse
          search='https://www.holtek.com.cn/webapi/api/Page/GetSearchResult'
          pageapi='https://www.holtek.com.cn/webapi/api/Page/GetPageHtml'
          candidates=[]
          for lang in (1,2,3):
            for kw in ('8.3.3','V8.3.3','HT-IDE3000 V8.3.3','HT-IDE3000'):
              req={'Keyword':kw,'CLanguageType':lang,'Category':'News','SubCategory':'Tools News','PageIndex':1,'PageSize':200}
              p=subprocess.run(['curl','-fsSL','--max-time','30','-A','Mozilla/5.0','-H','Content-Type: application/json','--data-binary',json.dumps(req),search],capture_output=True,text=True)
              if p.returncode: continue
              obj=json.loads(p.stdout); items=(obj.get('Entries') or {}).get('SearchList') or []
              print(f'\n=== lang={lang} kw={kw!r} total={obj.get("TotalItems")} returned={len(items)} ===')
              for item in items:
                text=' '.join(str(item.get(k,'')) for k in ('Title','Content','PageURL'))
                if re.search(r'8[._ ]?3[._ ]?3|V8\.3\.3|IDE3000',text,re.I):
                  print(json.dumps(item,ensure_ascii=False))
                if re.search(r'8[._ ]?3[._ ]?3|V8\.3\.3',text,re.I):
                  u=item.get('PageURL')
                  if u and u not in candidates: candidates.append(u)
          print('\n=== candidate pages ===',candidates)
          for rel in candidates:
            full='https://www.holtek.com.cn'+rel if rel.startswith('/') else rel
            q=urllib.parse.urlencode({'CLanguageType':3,'CUrl':full})
            p=subprocess.run(['curl','-fsSL','--max-time','30','-A','Mozilla/5.0',pageapi+'?'+q],capture_output=True,text=True)
            print('\n### PAGE',full,'###')
            if p.returncode:
              print('curl failed',p.stderr); continue
            try: obj=json.loads(p.stdout)
            except Exception:
              print(p.stdout[:2000]); continue
            entries=obj.get('Entries') or {}
            raw=json.dumps(entries,ensure_ascii=False)
            print('keys=',list(entries) if isinstance(entries,dict) else type(entries).__name__)
            for pat in (r'HT-IDE[^"<]{0,120}',r'8\.3\.3',r'833',r'https?[^"<> ]+',r'/webapi/[^"<> ]+',r'[A-Za-z0-9_.+ -]+\.(?:zip|exe)'):
              vals=[]
              for m in re.finditer(pat,raw,re.I):
                v=m.group(0)
                if v not in vals: vals.append(v)
              if vals:
                print(pat,':')
                for v in vals[:40]: print(' ',v)
          PY
