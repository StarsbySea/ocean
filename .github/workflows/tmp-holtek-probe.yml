name: Temporary Holtek Probe

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Holtek search and resource API routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --max-time 30 --retry 2 -A 'Mozilla/5.0' 'https://www.holtek.com.cn/main.d158c34aecaf41c9.js' -o main.js
          python3 - <<'PY'
          import re
          text=open('main.js','r',encoding='utf-8',errors='ignore').read()
          patterns=[
            r'GetSearch',r'SearchList',r'SearchResult',r'FullText',r'Keyword',
            r'Tools Software',r'ToolSoftware',r'Resource',r'DownloadFile',r'Download',
            r'GetCategoriesPage',r'contentlist',r'toolnews'
          ]
          for pat in patterns:
              ms=list(re.finditer(pat,text,re.I))
              print(f'\n===== {pat} ({len(ms)}) =====')
              for m in ms[:20]:
                  s=max(0,m.start()-320); e=min(len(text),m.end()+520)
                  print(text[s:e].replace('\\n',' ').replace('\\r',' '))
          PY
