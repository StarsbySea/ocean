name: Temporary Holtek Probe

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query Holtek tools software search API
        shell: bash
        run: |
          set -euo pipefail
          api='https://www.holtek.com.cn/webapi/api/Page/GetSearchResult'
          for lang in 1 2 3; do
            for sub in '' 'Tools Software'; do
              echo "===== lang=$lang sub=$sub ====="
              python3 - "$lang" "$sub" > body.json <<'PY'
          import json,sys
          lang=int(sys.argv[1]); sub=sys.argv[2]
          category={1:'資源',2:'资源',3:'Resource'}[lang] if sub else ''
          print(json.dumps({
            'Keyword':'HT-IDE3000',
            'CLanguageType':lang,
            'Category':category,
            'SubCategory':sub,
            'PageIndex':1,
            'PageSize':50
          },ensure_ascii=False))
          PY
              curl -fL --max-time 30 --retry 1 -A 'Mozilla/5.0' \
                -H 'Content-Type: application/json' \
                --data-binary @body.json "$api" -o result.json
              python3 - <<'PY'
          import json
          obj=json.load(open('result.json',encoding='utf-8'))
          print('StatusCode=',obj.get('StatusCode'),'TotalItems=',obj.get('TotalItems'))
          entries=obj.get('Entries') or {}
          print('CategoryList=',entries.get('CategoryList'))
          for item in entries.get('SearchList') or []:
              print(json.dumps(item,ensure_ascii=False))
          PY
            done
          done
