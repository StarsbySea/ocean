name: Temporary Holtek Probe

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stable HT-IDE3000 download endpoint
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.holtek.com.cn/WebAPI/9f0f1311-eed7-4825-8cb9-37531bde38f7'
          echo '=== HEAD ==='
          curl -fsSIL --max-time 60 -A 'Mozilla/5.0' "$url" | grep -Ei '^(HTTP/|location:|content-type:|content-length:|content-disposition:|last-modified:|etag:)' || true
          echo '=== DOWNLOAD ==='
          curl -fsSL --max-time 600 --retry 2 -A 'Mozilla/5.0' "$url" -o htide.zip
          sha256sum htide.zip
          stat -c 'size=%s' htide.zip
          file htide.zip
          echo '=== ZIP LIST ==='
          unzip -l htide.zip | head -80
