name: Temporary QQ Hash

on:
  push:
    branches:
      - fix-qq-updates
    paths:
      - .github/workflows/tmp-qq-hash.yml

jobs:
  hash:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            url: https://qqdl.gtimg.cn/qqfile/QQNT/9.9.33/release/497e2f1f/QQ_9.9.33_260813_x64_01.exe
          - arch: x86
            url: https://qqdl.gtimg.cn/qqfile/QQNT/9.9.33/release/497e2f1f/QQ_9.9.33_260813_x86_01.exe
    runs-on: ubuntu-latest
    steps:
      - name: Download official QQ installer and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 '${{ matrix.url }}' -o qq.exe
          echo '${{ matrix.arch }}:'
          sha256sum qq.exe
          stat -c 'size=%s' qq.exe
