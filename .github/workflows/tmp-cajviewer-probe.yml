name: Temporary CAJViewer Probe

on:
  push:
    branches:
      - fix-cajviewer-updates
    paths:
      - .github/workflows/tmp-cajviewer-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Parallel-download official CAJViewer installers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, concurrent.futures, hashlib, os, re

          UA='Mozilla/5.0'
          urls={
            'x64':'https://cajviewer.oversea.cnki.net/down/CAJViewer%208.1_x64-setup.exe',
            'x86':'https://cajviewer.oversea.cnki.net/down/CAJViewer8.0.1.1-setup.exe'
          }

          def size_of(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA},method='HEAD')
            with urllib.request.urlopen(req,timeout=60) as r:
              return int(r.headers['Content-Length']), dict(r.headers)

          def download(name,url):
            size,headers=size_of(url)
            print(f'{name}: size={size} last-modified={headers.get("Last-Modified")} etag={headers.get("ETag")}')
            workers=16
            chunk=(size + workers - 1)//workers
            ranges=[]
            for i in range(workers):
              start=i*chunk
              if start>=size: break
              end=min(size-1,(i+1)*chunk-1)
              ranges.append((i,start,end))
            def get_part(t):
              i,start,end=t
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Range':f'bytes={start}-{end}'})
              with urllib.request.urlopen(req,timeout=300) as r:
                data=r.read()
                cr=r.headers.get('Content-Range')
                if len(data)!=(end-start+1):
                  raise RuntimeError(f'{name} part {i} expected {end-start+1}, got {len(data)} range={cr}')
                print(f'{name}: part {i} {start}-{end} ok')
                return i,data
            parts=[None]*len(ranges)
            with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as ex:
              for i,data in ex.map(get_part,ranges): parts[i]=data
            out=f'{name}.exe'
            h=hashlib.sha256()
            total=0
            with open(out,'wb') as f:
              for data in parts:
                f.write(data); h.update(data); total+=len(data)
            if total!=size: raise RuntimeError(f'{name} assembled {total} != {size}')
            print(f'{name}: sha256={h.hexdigest()} size={total}')

          for name,url in urls.items():
            download(name,url)

          xml='https://cajviewer.oversea.cnki.net/down/CAJUpgrade/CAJIncrementalUpdate/x64/CurrentVersion.xml'
          req=urllib.request.Request(xml,headers={'User-Agent':UA})
          with urllib.request.urlopen(req,timeout=60) as r:
            text=r.read().decode('utf-8','replace')
          m=re.search(r'<root\s+version="([\d.]+)"',text)
          print('CurrentVersion=',m.group(1) if m else 'NO MATCH')
          PY
