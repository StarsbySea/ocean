name: Temporary CAJViewer Probe

on:
  push:
    branches:
      - fix-cajviewer-updates
    paths:
      - .github/workflows/tmp-cajviewer-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe updater metadata and range support
        shell: bash
        run: |
          set -u
          echo '=== updater metadata candidates ==='
          candidates=(
            'https://cajviewer.oversea.cnki.net/CAJUpgrade/CAJIncrementalUpdate/x64/CurrentVersion.xml'
            'https://cajviewer.oversea.cnki.net/down/CAJUpgrade/CAJIncrementalUpdate/x64/CurrentVersion.xml'
            'https://cajviewer.cnki.net/CAJUpgrade/CAJIncrementalUpdate/x64/CurrentVersion.xml'
            'https://download.cnki.net/CAJUpgrade/CAJIncrementalUpdate/x64/CurrentVersion.xml'
          )
          for u in "${candidates[@]}"; do
            echo "--- $u"
            curl -k -L --max-time 20 -A 'Mozilla/5.0' -sS -D headers.txt "$u" -o body.txt
            rc=$?
            grep -Ei '^(HTTP/|content-type:|content-length:|location:)' headers.txt || true
            echo "curl_rc=$rc bytes=$(wc -c < body.txt 2>/dev/null || echo 0)"
            head -c 800 body.txt 2>/dev/null || true; echo
          done
          echo '=== x64 range probe ==='
          u='https://cajviewer.oversea.cnki.net/down/CAJViewer%208.1_x64-setup.exe'
          curl -k -L --max-time 30 -A 'Mozilla/5.0' -r 0-1048575 -D range-headers.txt "$u" -o range.bin
          rc=$?
          grep -Ei '^(HTTP/|content-range:|accept-ranges:|content-length:)' range-headers.txt || true
          echo "range_rc=$rc bytes=$(wc -c < range.bin 2>/dev/null || echo 0)"
