name: Temporary CAJViewer Probe

on:
  push:
    branches:
      - fix-cajviewer-updates
    paths:
      - .github/workflows/tmp-cajviewer-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official CAJViewer installers
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://cajviewer.oversea.cnki.net/down/CAJViewer%208.1_x64-setup.exe'
            'https://cajviewer.oversea.cnki.net/down/CAJViewer8.0.1.1-setup.exe'
          )
          names=('x64' 'x86')
          for i in 0 1; do
            echo "--- ${names[$i]} HEAD ---"
            curl -k -fLI --max-time 30 --retry 1 -A 'Mozilla/5.0' "${urls[$i]}" | grep -Ei '^(HTTP/|content-type:|content-length:|last-modified:|etag:)' || true
            echo "--- ${names[$i]} download/hash ---"
            curl -k -fL --max-time 180 --retry 1 -A 'Mozilla/5.0' "${urls[$i]}" -o "caj-${names[$i]}.exe"
            sha256sum "caj-${names[$i]}.exe"
            stat -c '%n size=%s' "caj-${names[$i]}.exe"
          done
