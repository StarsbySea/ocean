name: Temporary Holtek Checkver

on:
  push:
    branches:
      - fix-ht-ide3000-updates
    paths:
      - .github/workflows/tmp-holtek-checkver.yml

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - name: Test checkver in PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{ Keyword = 'HT-IDE3000'; CLanguageType = 3; Category = 'News'; SubCategory = 'Tools News'; PageIndex = 1; PageSize = 200 } | ConvertTo-Json
          Write-Host "BODY=$body"
          $resp = Invoke-RestMethod -Method Post -Uri 'https://www.holtek.com.cn/webapi/api/Page/GetSearchResult' -ContentType 'application/json' -Body $body
          Write-Host "StatusCode=$($resp.StatusCode) TotalItems=$($resp.TotalItems)"
          $items = $resp.Entries.SearchList
          Write-Host "Count=$($items.Count)"
          $titles = $items | Where-Object { $_.Title -match 'HT-IDE3000.*V[\d.]+' } | Select-Object -ExpandProperty Title
          $titles | Select-Object -First 30 | ForEach-Object { Write-Host "TITLE=$_" }
          $versions = $items | ForEach-Object { if ($_.Title -match '^HT-IDE3000\s*V(?<version>[\d.]+)\s+Release') { [version]$matches.version } } | Sort-Object -Descending
          Write-Host "VersionsCount=$($versions.Count)"
          $versions | Select-Object -First 10 | ForEach-Object { Write-Host "VERSION=$($_.ToString())" }
          if ($versions.Count -gt 0) { Write-Output $versions[0].ToString() }
      - name: Test checkver in Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @{ Keyword = 'HT-IDE3000'; CLanguageType = 3; Category = 'News'; SubCategory = 'Tools News'; PageIndex = 1; PageSize = 200 } | ConvertTo-Json
          Write-Host "BODY=$body"
          $resp = Invoke-RestMethod -Method Post -Uri 'https://www.holtek.com.cn/webapi/api/Page/GetSearchResult' -ContentType 'application/json' -Body $body
          Write-Host "StatusCode=$($resp.StatusCode) TotalItems=$($resp.TotalItems)"
          $items = $resp.Entries.SearchList
          Write-Host "Count=$($items.Count)"
          $titles = $items | Where-Object { $_.Title -match 'HT-IDE3000.*V[\d.]+' } | Select-Object -ExpandProperty Title
          $titles | Select-Object -First 30 | ForEach-Object { Write-Host "TITLE=$_" }
          $versions = $items | ForEach-Object { if ($_.Title -match '^HT-IDE3000\s*V(?<version>[\d.]+)\s+Release') { [version]$matches.version } } | Sort-Object -Descending
          Write-Host "VersionsCount=$($versions.Count)"
          $versions | Select-Object -First 10 | ForEach-Object { Write-Host "VERSION=$($_.ToString())" }
          if ($versions.Count -gt 0) { Write-Output $versions[0].ToString() }
