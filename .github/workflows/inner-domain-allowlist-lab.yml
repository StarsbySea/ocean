name: Inner domain allowlist lab
on:
  push:
    branches: [experiment/ubuntu-slim-network-isolation]
    paths: [.github/workflows/inner-domain-allowlist-lab.yml]
  workflow_dispatch:
permissions: {}
jobs:
  inner:
    strategy:
      fail-fast: false
      matrix:
        pid: ['true', 'false']
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - name: Bootstrap pinned inner
        shell: bash
        run: |
          set -eu
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq bubblewrap python3-venv
          mkdir -p "$RUNNER_TEMP/inner-bin" "$HOME/inner-lab" "$HOME/.config/inner/profiles"
          cd "$RUNNER_TEMP/inner-bin"
          curl -fsSL --retry 2 --max-time 60 https://github.com/enr/inner/releases/download/v0.16.2/inner-v0.16.2-linux-amd64.zip -o inner.zip
          echo 'a78e417741b2deb268518d9e1dff7f4b5929f9a63512dc2188c72ce7b9827c76  inner.zip' | sha256sum -c -
          python3 -m zipfile -e inner.zip unpack
          find unpack -type f -name inner -exec cp {} ./inner \;
          chmod +x inner
          ./inner --version
          ./inner run --help
          cat /proc/version
          echo "$PWD" >> "$GITHUB_PATH"
          cd "$HOME/inner-lab"
          python3 -m venv venv
          curl --noproxy '*' -fsS --max-time 15 https://pypi.org/simple/idna/ -o /dev/null
          curl --noproxy '*' -fsS --max-time 15 https://example.com/ -o /dev/null
          curl --noproxy '*' -fsS --max-time 15 https://registry.npmjs.org/is-number -o /dev/null
      - name: Verify restricted egress and real wheel download
        shell: bash
        env:
          TEST_PID_NAMESPACE: ${{ matrix.pid }}
        run: |
          set -eu
          cd "$HOME/inner-lab"
          cat > "$HOME/.config/inner/profiles/ci-fetch.toml" <<'TOML'
          [sandbox]
          network_mode = "allowlist"
          network_allow = ["pypi.org:443", "files.pythonhosted.org:443", "registry.npmjs.org:443"]
          home = "isolated"
          pid_namespace = true
          [entrypoint]
          cmd = "/usr/bin/python3"
          interactive = false
          TOML
          sed -i "s/^pid_namespace = true$/pid_namespace = $TEST_PID_NAMESPACE/" "$HOME/.config/inner/profiles/ci-fetch.toml"
          inner doctor || true
          inner run -p ci-fetch -w "$PWD" --dry-run -- probe.py
          cat > probe.py <<'PY'
          import os, socket, subprocess, pathlib
          def request(url, *options):
              p = subprocess.run(["curl","-fsS","--connect-timeout","5","--max-time","15","-o","/dev/null",*options,url],capture_output=True,text=True)
              print("CURL",url,options,p.returncode,p.stderr[:300],flush=True)
              return p.returncode
          print("NETNS",os.readlink("/proc/self/ns/net"),flush=True)
          assert os.readlink("/proc/self/ns/net") != pathlib.Path("host-netns").read_text()
          assert request("https://pypi.org/simple/idna/") == 0
          assert request("https://registry.npmjs.org/is-number") == 0
          assert request("https://example.com/") != 0
          assert request("https://1.1.1.1/") != 0
          assert request("http://pypi.org/") != 0
          assert request("https://pypi.org/simple/idna/","--noproxy","*") != 0
          with socket.socket() as s:
              s.settimeout(2)
              assert s.connect_ex(("1.1.1.1",443)) != 0
          subprocess.run(["/usr/bin/python3","-c","import socket;s=socket.socket();s.settimeout(2);assert s.connect_ex(('1.1.1.1',443)) != 0"],check=True)
          subprocess.run(["venv/bin/python","-m","pip","download","--disable-pip-version-check","--no-cache-dir","--only-binary=:all:","--no-deps","--index-url","https://pypi.org/simple","--dest","wheels","idna==3.10"],check=True)
          assert pathlib.Path("wheels/idna-3.10-py3-none-any.whl").is_file()
          print("PASS: exact domains, ports, direct bypass, descendant and wheel download",flush=True)
          PY
          readlink /proc/self/ns/net | tr -d '\n' > host-netns
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY -u http_proxy -u https_proxy -u all_proxy -u NO_PROXY -u no_proxy inner run -p ci-fetch -w "$PWD" -- probe.py
          test -f wheels/idna-3.10-py3-none-any.whl
          echo "PASS: restricted dependency fetch (diagnostic PID namespace=$TEST_PID_NAMESPACE)" >> "$GITHUB_STEP_SUMMARY"
