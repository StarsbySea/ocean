name: Temporary PDFPatcher Hash

on:
  push:
    branches:
      - fix-pdfpatcher-updates
    paths:
      - .github/workflows/tmp-pdfpatcher-hash.yml

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Download official release and calculate SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://github.com/wmjordan/PDFPatcher/releases/download/v1.1/PDFPatcher.1.1.0.4632.7z' -o PDFPatcher.1.1.0.4632.7z
          sha256sum PDFPatcher.1.1.0.4632.7z
