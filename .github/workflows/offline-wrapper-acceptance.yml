name: Offline wrapper acceptance
on:
  push:
    branches: [experiment/ubuntu-slim-network-isolation]
    paths:
      - .github/scripts/offline.sh
      - .github/scripts/offline-shell
      - .github/scripts/offline-guard.sh
      - .github/workflows/offline-wrapper-acceptance.yml
      - .github/tests/offline_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate fail-closed wrapper
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/scripts/offline{.sh,-guard.sh,-shell}; do bash -n "$file"; done
          runner="$PWD/.github/scripts/offline.sh"
          bash "$runner" true
          code=0
          bash "$runner" || code=$?
          test "$code" = 64
          code=0
          bash "$runner" bash -c 'exit 42' || code=$?
          test "$code" = 42
          test "$(bash "$runner" printf '%s' 'space ; $ literal')" = 'space ; $ literal'
          mkdir -p "$RUNNER_TEMP/offline-shim"
          printf '#!/bin/sh\nexit 77\n' > "$RUNNER_TEMP/offline-shim/unshare"
          chmod +x "$RUNNER_TEMP/offline-shim/unshare"
          marker="$RUNNER_TEMP/offline-executed"
          code=0
          PATH="$RUNNER_TEMP/offline-shim:$PATH" bash "$runner" touch "$marker" || code=$?
          test "$code" = 77
          test ! -e "$marker"
          echo 'PASS: syntax, arguments, status propagation and fail-closed behavior' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify live network isolation and compatibility
        shell: bash
        run: python3 .github/tests/offline_probe.py

  default-shell:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        shell: offline-shell {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Online setup and positive control
        shell: bash
        run: |
          for file in .github/scripts/offline{.sh,-guard.sh,-shell}; do bash -n "$file"; done
          install -d "$RUNNER_TEMP/offline-bin"
          install -m 755 .github/scripts/offline.sh .github/scripts/offline-guard.sh .github/scripts/offline-shell "$RUNNER_TEMP/offline-bin/"
          echo "$RUNNER_TEMP/offline-bin" >> "$GITHUB_PATH"
          echo "ORIGINAL_NETNS=$(readlink /proc/self/ns/net)" >> "$GITHUB_ENV"
          python3 -c 'import socket; socket.create_connection(("1.1.1.1",443),5).close()'
      - name: Automatically offline
        run: |
          test "$(readlink /proc/self/ns/net)" != "$ORIGINAL_NETNS"
          grep -E '^CapEff:|^CapBnd:|^NoNewPrivs:' /proc/self/status
          python3 - <<'PY'
          import socket, errno
          with socket.socket() as s:
              s.settimeout(2)
              try: s.connect(("1.1.1.1",443))
              except OSError as e: assert e.errno in (errno.ENETUNREACH, errno.EPERM, errno.EACCES), repr(e)
              else: raise AssertionError("unexpected network access")
          PY
      - name: Automatically offline in another working directory
        working-directory: .github
        run: |
          test "$(readlink /proc/self/ns/net)" != "$ORIGINAL_NETNS"
          test -d scripts
          echo 'PASS: custom default shell and alternate working directory' >> "$GITHUB_STEP_SUMMARY"
      - name: Explicit online override
        shell: bash
        run: |
          test "$(readlink /proc/self/ns/net)" = "$ORIGINAL_NETNS"
          python3 -c 'import socket; socket.create_connection(("1.1.1.1",443),5).close()'
      - name: Default offline restored automatically
        run: test "$(readlink /proc/self/ns/net)" != "$ORIGINAL_NETNS"
